
[functions.fatsecret-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/fatsecret-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fatsecret-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fatsecret-proxy/*.html" ]

[functions.send-push]
enabled = true
# Called by a database trigger with a shared secret, not a user JWT.
verify_jwt = false

[functions.delete-account]
enabled = true
# Called by the signed-in user; the JWT identifies whose account to delete.
verify_jwt = true

[functions.send-email]
enabled = true
# Auth Send-Email hook (signature-checked), signed-in support tickets
# (JWT checked in the function) and the signed-out website deletion form.
verify_jwt = false

[functions.revenuecat-webhook]
enabled = true
# Called by RevenueCat with its own shared secret (checked in constant time,
# fails closed), not a Supabase JWT; the gateway would reject it otherwise.
verify_jwt = false

[functions.sync-subscription]
enabled = true
# Called by the signed-in user after a purchase or restore; the JWT names
# whose status is refreshed from RevenueCat.
verify_jwt = true
