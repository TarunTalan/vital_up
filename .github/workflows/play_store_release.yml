name: Play Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Store Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      use_shorebird:
        description: 'Build and register release using Shorebird (for future OTA patches)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Obfuscated AAB & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'
          cache: true

      - name: Set up Shorebird CLI (if enabled)
        if: ${{ inputs.use_shorebird == true }}
        uses: shorebirdtech/shorebird-action@v0
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Decode Environment Secrets (.env)
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Decode Android Keystore & Key Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_CONTENT: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/vitalup-release-key.jks
          fi
          if [ -n "$KEY_PROPERTIES_CONTENT" ]; then
            echo "$KEY_PROPERTIES_CONTENT" > android/key.properties
          fi

      - name: Decode Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      # =======================================================================
      # Release Build with Dart & R8 Obfuscation + Symbol Generation
      # =======================================================================
      - name: Build Standard Obfuscated App Bundle
        if: ${{ inputs.use_shorebird != true }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Shorebird Release App Bundle
        if: ${{ inputs.use_shorebird == true }}
        run: |
          shorebird release android --no-confirm

      - name: Archive Obfuscation Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols
          path: build/app/outputs/symbols/
          if-no-files-found: ignore

      - name: Archive Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: vitalup-release-aab
          path: build/app/outputs/bundle/release/*.aab

      # =======================================================================
      # Optional: Upload to Google Play Store Console
      # =======================================================================
      - name: Upload to Google Play Console
        if: ${{ env.HAVE_PLAY_KEY == 'true' }}
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.tarun_siddhi.vital_up
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          debugSymbols: build/app/outputs/symbols

      # =======================================================================
      # GitHub Release Tagging
      # =======================================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
