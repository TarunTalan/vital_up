name: Play Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Store Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Play release status. Use draft until the app has been published once.'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - completed
      use_shorebird:
        description: 'Build with Shorebird so the release can receive OTA patches'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Obfuscated AAB & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      FLUTTER_VERSION: '3.44.3'
      SYMBOLS_DIR: build/app/outputs/symbols
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab
      # Tag pushes always go through Shorebird: a release built without it can never be patched.
      USE_SHOREBIRD: ${{ github.event_name == 'push' || inputs.use_shorebird }}
      HAVE_PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}
      HAVE_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ] && [ "$TAG_VERSION" != "${PUBSPEC_VERSION%%+*}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION. Bump pubspec (and the +build number) first."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        if: env.USE_SHOREBIRD == 'true'
        uses: shorebirdtech/shorebird-action@v0
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      # A release must never fall back to .env.example or the debug signing key.
      - name: Write release secrets
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_CONTENT: ${{ secrets.KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          missing=""
          [ -z "$ENV_CONTENT" ] && missing="$missing ENV_FILE"
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEY_PROPERTIES_CONTENT" ] && missing="$missing KEY_PROPERTIES"
          [ -z "$GOOGLE_SERVICES_JSON" ] && missing="$missing GOOGLE_SERVICES_JSON_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "$ENV_CONTENT" > .env
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/vitalup-release-key.jks
          echo "$KEY_PROPERTIES_CONTENT" > android/key.properties
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        run: flutter test --no-pub

      # =======================================================================
      # Release Build with Dart & R8 Obfuscation + Symbol Generation
      # =======================================================================
      - name: Build Standard Obfuscated App Bundle
        if: env.USE_SHOREBIRD != 'true'
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=$SYMBOLS_DIR

      # Patches must later be built with the same flags (see shorebird_patch.yml).
      - name: Build Shorebird Release App Bundle
        if: env.USE_SHOREBIRD == 'true'
        run: |
          shorebird release android \
            --flutter-version=$FLUTTER_VERSION \
            --no-confirm \
            -- --obfuscate --split-debug-info=$SYMBOLS_DIR

      - name: Verify release signing
        run: |
          if keytool -printcert -jarfile "$AAB_PATH" | grep -q "CN=Android Debug"; then
            echo "::error::App bundle is signed with the debug key. Check KEYSTORE_BASE64 / KEY_PROPERTIES."
            exit 1
          fi

      - name: Archive Obfuscation Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols-${{ github.run_number }}
          path: |
            ${{ env.SYMBOLS_DIR }}/
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Archive Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: vitalup-release-aab-${{ github.run_number }}
          path: ${{ env.AAB_PATH }}

      # The Crashlytics Gradle plugin uploads the R8 mapping during the build;
      # Dart symbols have to be uploaded separately to read obfuscated Dart traces.
      - name: Upload Dart symbols to Crashlytics
        if: env.HAVE_FIREBASE_SA == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name=="com.vitalup.app") | .client_info.mobilesdk_app_id' android/app/google-services.json)
          npx --yes firebase-tools crashlytics:symbols:upload --app="$APP_ID" "$SYMBOLS_DIR"

      # =======================================================================
      # Optional: Upload to Google Play Console
      # (the very first AAB must be uploaded by hand in the Play Console)
      # =======================================================================
      - name: Upload to Google Play Console
        if: env.HAVE_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.vitalup.app
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.release_status || 'draft' }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      # =======================================================================
      # GitHub Release Tagging
      # =======================================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.AAB_PATH }}
          generate_release_notes: true
