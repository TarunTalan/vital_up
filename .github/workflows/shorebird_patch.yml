name: Shorebird Patch (Instant Code Push)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Target release version to patch (e.g. 1.0.0+1). Must match the version on Google Play Store.'
        required: true
        type: string
      dry_run:
        description: 'Dry run (verify patch without publishing to users)'
        required: false
        default: false
        type: boolean

concurrency:
  group: shorebird-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: Build & Deploy Shorebird Patch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/shorebird-action@v0
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Decode Environment Secrets (.env)
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Decode Android Keystore & Key Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_CONTENT: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/vitalup-release-key.jks
          fi
          if [ -n "$KEY_PROPERTIES_CONTENT" ]; then
            echo "$KEY_PROPERTIES_CONTENT" > android/key.properties
          fi

      - name: Decode Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Shorebird Setup
        run: shorebird doctor

      - name: Deploy Shorebird Patch
        env:
          IS_DRY_RUN: ${{ inputs.dry_run }}
          TARGET_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "Performing dry-run patch verification..."
            shorebird patch android --dry-run --release-version="$TARGET_VERSION"
          else
            echo "Deploying live patch for release version $TARGET_VERSION..."
            shorebird patch android --release-version="$TARGET_VERSION" --no-confirm
          fi
