name: vital_up
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+4

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (MVVM / Cubit)
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # Dependency Injection
  get_it: ^9.2.1

  # Routing
  go_router: ^17.3.0

  # Network & API
  dio: ^5.5.0
  supabase_flutter: ^2.5.4

  # Offline DB & Storage
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3

  # Utilities & Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5
  intl: ^0.20.2
  logger: ^2.4.0
  uuid: ^4.4.0
  image: ^4.3.0

  # UI / Charts
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.2.1
  android_intent_plus: ^6.0.0
  health: ^13.3.1
  geolocator: ^13.0.2
  pedometer: ^4.0.2
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  mapbox_maps_flutter: ^2.25.1
  flutter_foreground_task: ^9.2.2
  injectable: ^2.4.1
  camera: ^0.11.0+2
  google_mlkit_barcode_scanning: ^0.12.0
  google_mlkit_text_recognition: ^0.12.0
  image_picker: ^1.1.2
  device_preview: ^1.2.0


  # Activity Tracking extras
  flutter_tts: ^4.1.0
  flutter_blue_plus: ^1.35.3
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  on_audio_query_forked: ^2.9.1
  on_audio_query_android: ^1.1.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.4.0
  envied: ^1.1.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.2
  home_widget: ^0.10.0
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  archive: ^4.3.0
  connectivity_plus: ^7.3.1
  background_downloader: ^9.5.9
  purchases_flutter: ^10.16.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

  # Code generation
  build_runner: ^2.4.9
  envied_generator: ^1.1.1
  isar_community_generator: ^3.3.2
  drift_dev: ^2.16.0
  injectable_generator: ^2.6.1

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/badges/
    - assets/icons/
    - assets/icons/app/
    - assets/icons/auth/
    - assets/icons/awards/
    - assets/icons/gamification/
    - assets/icons/leaderboard_ranks/
    - assets/icons/levels/
    - assets/icons/nav/
    - assets/icons/onboarding/
    - assets/icons/trackers/
    - assets/icons/ui/
    - assets/icons/vita/
    - assets/audio/
    - assets/data/
    # JetBrains Mono for captions: google_fonts uses this instead of fetching.
    - assets/google_fonts/
    - assets/fonts/licenses/
    - shorebird.yaml


  fonts:
    # Nunito (SIL OFL 1.1, assets/fonts/licenses), subset to Latin,
    # punctuation, currency (incl. the rupee sign) and common symbols.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app/app_icon_launcher.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app/app_icon_launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
