<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="w25_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1BEE7" />
      <stop offset="50%" stop-color="#9C6ADE" />
      <stop offset="100%" stop-color="#512DA8" />
    </linearGradient>
    <linearGradient id="w25_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#211530" />
      <stop offset="100%" stop-color="#0E0817" />
    </linearGradient>
    <filter id="w25_glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9C6ADE" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Warrior Shield -->
  <path d="M60 4 L106 20 C106 74 60 114 60 114 C60 114 14 74 14 20 Z" fill="url(#w25_bg)" stroke="url(#w25_rim)" stroke-width="4" stroke-linejoin="round" />
  <path d="M60 12 L98 26 C98 68 60 104 60 104 C60 104 22 68 22 26 Z" fill="none" stroke="#9C6ADE" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Crossed Barbells in Background -->
  <g stroke="#9C6ADE" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="32" y1="32" x2="88" y2="84" />
    <line x1="88" y1="32" x2="32" y2="84" />
  </g>
  <!-- Center Power Plate -->
  <g filter="url(#w25_glow)">
    <circle cx="60" cy="56" r="22" fill="#180C26" stroke="url(#w25_rim)" stroke-width="3" />
    <circle cx="60" cy="56" r="17" fill="none" stroke="#E1BEE7" stroke-width="1.5" stroke-dasharray="4 2" />
    <!-- "25" Engraved in Center -->
    <text x="60" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#E1BEE7" text-anchor="middle">25</text>
  </g>
  <!-- Regular Plaque -->
  <rect x="30" y="86" width="60" height="18" rx="9" fill="#12081C" stroke="url(#w25_rim)" stroke-width="1.5" />
  <text x="60" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#E1BEE7" text-anchor="middle" letter-spacing="1">REGULAR</text>
</svg>
