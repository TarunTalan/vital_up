<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lv5_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="30%" stop-color="#19C3E0" />
      <stop offset="70%" stop-color="#00ACC1" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
    <linearGradient id="lv5_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E232A" />
      <stop offset="100%" stop-color="#051014" />
    </linearGradient>
    <filter id="lv5_glow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#19C3E0" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Winged Star Shield -->
  <polygon points="60,4 104,22 108,76 60,116 12,76 16,22" fill="url(#lv5_bg)" stroke="url(#lv5_cyan)" stroke-width="4.5" stroke-linejoin="round" />
  <polygon points="60,12 96,27 100,72 60,106 20,72 24,27" fill="none" stroke="#19C3E0" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Radiant Top Star -->
  <polygon points="60,18 63,25 70,26 65,30 67,37 60,33 53,37 55,30 50,26 57,25" fill="#E0F7FA" />
  <!-- Center Star Shield with "5" -->
  <g filter="url(#lv5_glow)">
    <circle cx="60" cy="58" r="24" fill="#0A1D23" stroke="url(#lv5_cyan)" stroke-width="3" />
    <!-- Outer Wing Accents -->
    <path d="M30 46 C34 40 44 42 48 50 C42 56 34 56 28 52 Z" fill="#19C3E0" opacity="0.7" />
    <path d="M90 46 C86 40 76 42 72 50 C78 56 86 56 92 52 Z" fill="#19C3E0" opacity="0.7" />
    <!-- Bold "5" -->
    <text x="60" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#E0F7FA" text-anchor="middle">5</text>
  </g>
  <!-- Level 5 Banner -->
  <rect x="28" y="86" width="64" height="20" rx="10" fill="#081A20" stroke="url(#lv5_cyan)" stroke-width="2" />
  <text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#E0F7FA" text-anchor="middle" letter-spacing="1">LEVEL 5</text>
</svg>
