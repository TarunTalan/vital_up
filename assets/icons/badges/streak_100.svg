<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="s100_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="s100_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2110" />
      <stop offset="100%" stop-color="#120D04" />
    </linearGradient>
    <filter id="s100_shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFB300" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Grand Beveled Hexagon Shield -->
  <polygon points="60,4 108,26 108,82 60,116 12,82 12,26" fill="url(#s100_bg)" stroke="url(#s100_gold)" stroke-width="4.5" stroke-linejoin="round" />
  <polygon points="60,12 100,31 100,77 60,107 20,77 20,31" fill="none" stroke="#FFD54F" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Centurion Laurel Wreath -->
  <g fill="url(#s100_gold)" filter="url(#s100_shadow)">
    <!-- Left wreath branch -->
    <path d="M34 42 C30 50 30 65 37 76 C40 68 38 56 42 48 Z" />
    <circle cx="33" cy="52" r="3.5" />
    <circle cx="34" cy="64" r="3.5" />
    <circle cx="38" cy="74" r="3.5" />
    <!-- Right wreath branch -->
    <path d="M86 42 C90 50 90 65 83 76 C80 68 82 56 78 48 Z" />
    <circle cx="87" cy="52" r="3.5" />
    <circle cx="86" cy="64" r="3.5" />
    <circle cx="82" cy="74" r="3.5" />
    <!-- Roman Crown Star at Apex -->
    <path d="M60 18 L63 26 L71 27 L65 32 L67 40 L60 36 L53 40 L55 32 L49 27 L57 26 Z" />
  </g>
  <!-- Center Plate with "100" -->
  <circle cx="60" cy="63" r="23" fill="#181206" stroke="url(#s100_gold)" stroke-width="2.5" />
  <!-- "100" Text -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="url(#s100_gold)" text-anchor="middle" letter-spacing="-0.5">100</text>
  <!-- Bottom Ribbon -->
  <path d="M30 88 L90 88 L84 104 L36 104 Z" fill="#201507" stroke="url(#s100_gold)" stroke-width="1.5" />
  <text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFF9C4" text-anchor="middle" letter-spacing="1.5">CENTURION</text>
</svg>
